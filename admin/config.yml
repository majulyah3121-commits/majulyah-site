backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - file: "index.html"
        label: "Page d'accueil"
        name: "home"
        fields:
          - {label: "Titre du site (Google / SEO)", name: "title", widget: "string"}
          - {label: "Description Google (SEO)", name: "description", widget: "text", required: false}
          - {label: "Image principale", name: "image", widget: "image", required: false}
          - {label: "Texte de la page", name: "body", widget: "markdown", required: false}
