backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - file: "index.html"
        label: "Page d'accueil"
        name: "home"
        fields:
          - {label: "Sur-titre (Créations artisanales)", name: "subtitle", widget: "string"}
          - {label: "Grand titre principal", name: "maintitle", widget: "string"}
          - {label: "Paragraphe de description", name: "description", widget: "text"}
          - {label: "Texte du bouton", name: "button_text", widget: "string"}
          - {label: "Photo du sac (Arrière-plan)", name: "hero_image", widget: "image"}
